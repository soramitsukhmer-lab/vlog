name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Accepts the SDK licenses and installs the platform the modules compile against (compileSdk 37).
      # AGP downloads any build tools it needs on top of that.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37'

      - uses: gradle/actions/setup-gradle@v4

      # The credentials are read by the GitHubPackages repository in library/build.gradle
      - name: Publish library and library-no-op
        run: ./gradlew :library:publishReleasePublicationToGitHubPackagesRepository :library-no-op:publishReleasePublicationToGitHubPackagesRepository
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
